      }
    };

    // Global Active State
    let contacts = [];
    let activeTab = 'dashboard';
    let activeDetailContactId = null;
    let selectedTemplateKey = 'initial';
    let velocityChartInstance = null;

    /* ==========================================================================
       DATE HELPERS & 3B7 RULE CALCULATOR
       ========================================================================== */

    function getRelativeDate(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    // Calculates elapsed business days (excluding Saturdays and Sundays)
    function calculateBusinessDaysElapsed(startDateStr) {
      const start = new Date(startDateStr);
      const now = new Date();
      let count = 0;
      let cur = new Date(start);

      cur.setDate(cur.getDate() + 1); // start counting next day
      while (cur <= now) {
        const dayOfWeek = cur.getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Not Sunday (0) or Saturday (6)
          count++;
        }
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    }

    // Determines 3B7 status object
    function get3B7Status(contact) {
      if (contact.stage !== 'AWAITING_REPLY' && contact.stage !== 'MESSAGED') {
        return { label: 'Active Pipeline', color: 'text-slate-400', bg: 'bg-slate-800', type: 'NORMAL' };
      }

      const bDays = calculateBusinessDaysElapsed(contact.lastContactDate);

      if (bDays < 3) {
        return { label: `${bDays}/3 B-Days (Awaiting)`, color: 'text-blue-400', bg: 'bg-blue-500/10 border-blue-500/30', type: 'WAITING' };
      } else if (bDays >= 3 && bDays < 7) {
        return { label: `${bDays} B-Days: Send Nudge!`, color: 'text-amber-400', bg: 'bg-amber-500/20 border-amber-500/40 animate-pulse', type: 'NUDGE_DUE' };
      } else {
        return { label: `${bDays} B-Days: Send Pivot / Archive`, color: 'text-rose-400', bg: 'bg-rose-500/20 border-rose-500/40 animate-pulse', type: 'PIVOT_DUE' };
      }
    }

    /* ==========================================================================
       APP INITIALIZATION & PERSISTENCE
       ========================================================================== */

    window.onload = function() {
      loadContacts();
      initVelocityChart();
      renderApp();
    };

    function loadContacts() {
      const saved = localStorage.getItem('ai_outreach_contacts_v1');
      if (saved) {
        try {
          contacts = JSON.parse(saved);
        } catch(e) {
          contacts = [...INITIAL_MOCK_CONTACTS];
        }
      } else {
        contacts = [...INITIAL_MOCK_CONTACTS];
        saveContacts();
      }
    }

    function saveContacts() {
      localStorage.setItem('ai_outreach_contacts_v1', JSON.stringify(contacts));
      renderApp();
    }

    function resetMockData() {
      contacts = JSON.parse(JSON.stringify(INITIAL_MOCK_CONTACTS));
      saveContacts();
      showToast('Reset to original sample dataset', 'info');
    }

    function renderApp() {
      renderDashboard();
      renderPipeline();
      renderDirectory();
      updateTemplatePreview();
    }

    /* ==========================================================================
       TAB NAVIGATION LOGIC
       ========================================================================== */

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('text-slate-400');
      });

      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.classList.add('bg-indigo-600', 'text-white');
        activeNav.classList.remove('text-slate-400');
      }

      if (tabId === 'dashboard' && velocityChartInstance) {
        velocityChartInstance.update();
      }
    }

    /* ==========================================================================
       DASHBOARD & KPI ENGINE
       ========================================================================== */

    function renderDashboard() {
      // 1. Calculate KPIs
      const messagedCount = contacts.filter(c => c.stage !== 'IDENTIFIED').length;
      const scheduledCount = contacts.filter(c => c.stage === 'INTERVIEW_SCHEDULED' || c.stage === 'FOLLOWUP_PENDING' || c.stage === 'ADVOCATE').length;
      const followUpPendingCount = contacts.filter(c => c.stage === 'FOLLOWUP_PENDING').length;
      const totalInterviews = contacts.filter(c => c.stage === 'FOLLOWUP_PENDING' || c.stage === 'ADVOCATE').length;
      
      // Update KPI Gauges
      document.getElementById('kpi-outreach-val').innerText = messagedCount;
      const outreachPct = Math.min(100, Math.round((messagedCount / 5) * 100));
      document.getElementById('kpi-outreach-bar').style.width = `${outreachPct}%`;
      document.getElementById('kpi-outreach-pct').innerText = `${outreachPct}%`;

      document.getElementById('kpi-interviews-val').innerText = scheduledCount;
      const scheduledPct = Math.min(100, Math.round((scheduledCount / 3) * 100));
      document.getElementById('kpi-interviews-bar').style.width = `${scheduledPct}%`;
      document.getElementById('kpi-interviews-pct').innerText = `${scheduledPct}%`;

      // 2. Actions Required Today Queue
      const queueList = document.getElementById('action-queue-list');
      queueList.innerHTML = '';
      let pendingActionCount = 0;

      contacts.forEach(contact => {
        const status = get3B7Status(contact);

        // Scenario A: Follow-up Pending (Post Interview Thank You)
        if (contact.stage === 'FOLLOWUP_PENDING') {
          pendingActionCount++;
          queueList.innerHTML += `
            <div class="p-3.5 rounded-xl bg-slate-900 border border-rose-500/30 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-envelope-open-text"></i></span>
                <div>
                  <h4 class="text-xs font-bold text-white">${contact.name} (${contact.company})</h4>
                  <p class="text-[11px] text-slate-400">Completed interview today — Send thank-you note within 24h.</p>
                </div>
              </div>
              <button onclick="launchTemplateForContact('${contact.id}', 'thankyou')" class="bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg shadow">
                Launch Thank-You
              </button>
            </div>
          `;
        }

        // Scenario B: Overdue 3B7 Nudge
        else if (status.type === 'NUDGE_DUE') {
          pendingActionCount++;
          queueList.innerHTML += `
            <div class="p-3.5 rounded-xl bg-slate-900 border border-amber-500/30 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-bell"></i></span>
                <div>
                  <h4 class="text-xs font-bold text-white">${contact.name} (${contact.company})</h4>
                  <p class="text-[11px] text-slate-400">Awaiting reply for >3 business days (${calculateBusinessDaysElapsed(contact.lastContactDate)} days elapsed).</p>
                </div>
              </div>
              <button onclick="launchTemplateForContact('${contact.id}', 'nudge')" class="bg-amber-600 hover:bg-amber-500 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg shadow">
                Send 3B7 Nudge
              </button>
            </div>
          `;
        }

        // Scenario C: Overdue 3B7 Pivot / Archive
        else if (status.type === 'PIVOT_DUE') {
          pendingActionCount++;
          queueList.innerHTML += `
            <div class="p-3.5 rounded-xl bg-slate-900 border border-rose-500/30 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-route"></i></span>
                <div>
                  <h4 class="text-xs font-bold text-white">${contact.name} (${contact.company})</h4>
                  <p class="text-[11px] text-slate-400">Awaiting reply for >7 business days. Send pivot or close out.</p>
                </div>
              </div>
              <button onclick="launchTemplateForContact('${contact.id}', 'pivot')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold px-3 py-1.5 rounded-lg border border-slate-700">
                Send Pivot Angle
              </button>
            </div>
          `;
        }
      });

      if (pendingActionCount === 0) {
        queueList.innerHTML = `
          <div class="p-6 text-center text-slate-400 text-xs bg-slate-900/40 rounded-xl border border-slate-800/80">
            <i class="fa-solid fa-circle-check text-emerald-400 text-xl mb-2"></i>
            <p class="font-semibold text-slate-300">All actions caught up!</p>
            <p class="text-[11px] text-slate-500 mt-0.5">No overdue 3B7 nudges or pending thank-you notes.</p>
          </div>
        `;
      }

      document.getElementById('action-queue-count').innerText = `${pendingActionCount} pending`;
    }

    /* ==========================================================================
       KANBAN PIPELINE ENGINE
       ========================================================================== */

    function renderPipeline() {
      const stages = ['IDENTIFIED', 'MESSAGED', 'AWAITING_REPLY', 'INTERVIEW_SCHEDULED', 'FOLLOWUP_PENDING', 'ADVOCATE'];
      const searchQuery = (document.getElementById('pipeline-search')?.value || '').toLowerCase();
      const sourceFilter = document.getElementById('pipeline-source-filter')?.value || 'ALL';

      stages.forEach(stage => {
        const colEl = document.getElementById(`col-${stage}`);
        const countEl = document.getElementById(`count-stage-${stage}`);
        if (!colEl) return;

        colEl.innerHTML = '';
        
        const filtered = contacts.filter(c => {
          const matchStage = c.stage === stage;
          const matchSearch = c.name.toLowerCase().includes(searchQuery) || c.company.toLowerCase().includes(searchQuery) || c.role.toLowerCase().includes(searchQuery);
          const matchSource = sourceFilter === 'ALL' || c.source === sourceFilter;
          return matchStage && matchSearch && matchSource;
        });

        countEl.innerText = filtered.length;

        filtered.forEach(contact => {
          const status3b7 = get3B7Status(contact);

          colEl.innerHTML += `
            <div draggable="true" ondragstart="handleDragStart(event, '${contact.id}')" onclick="openDetailModal('${contact.id}')" class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 hover:border-indigo-500/50 shadow-md cursor-pointer transition space-y-2 group">
              <div class="flex justify-between items-start">
                <h4 class="text-xs font-bold text-white group-hover:text-indigo-300 transition">${contact.name}</h4>
                <span class="text-[10px] text-slate-500 font-mono">${contact.lastContactDate.substring(5)}</span>
              </div>
              
              <p class="text-[11px] text-slate-400 font-medium leading-tight">${contact.role} <span class="text-slate-300">@ ${contact.company}</span></p>

              ${contact.stage === 'AWAITING_REPLY' || contact.stage === 'MESSAGED' ? `
                <div class="text-[10px] px-2 py-0.5 rounded-md border font-semibold inline-block ${status3b7.bg} ${status3b7.color}">
                  ${status3b7.label}
                </div>
              ` : ''}

              <div class="flex justify-between items-center pt-2 border-t border-slate-900 text-[10px] text-slate-500">
                <span class="bg-slate-900 px-2 py-0.5 rounded text-slate-400 font-medium">${contact.source}</span>
                <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-indigo-400"></i>
              </div>
            </div>
          `;
        });
      });
    }

    // Drag and Drop Handlers
    function allowDrop(ev) {
      ev.preventDefault();
    }

    function handleDragStart(ev, contactId) {
      ev.dataTransfer.setData("text/plain", contactId);
    }

    function handleDrop(ev, newStage) {
      ev.preventDefault();
      const contactId = ev.dataTransfer.getData("text/plain");
      const contact = contacts.find(c => c.id === contactId);
      if (contact && contact.stage !== newStage) {
        contact.stage = newStage;
        contact.lastContactDate = getRelativeDate(0);
        saveContacts();
        showToast(`Moved ${contact.name} to ${newStage.replace('_', ' ')}`, 'success');
      }
    }

    /* ==========================================================================
       DIRECTORY TABLE RENDERER
       ========================================================================== */

    function renderDirectory() {
      const tbody = document.getElementById('directory-tbody');
      if (!tbody) return;

      const query = (document.getElementById('directory-search')?.value || '').toLowerCase();
      tbody.innerHTML = '';

      const filtered = contacts.filter(c => 
        c.name.toLowerCase().includes(query) ||
        c.company.toLowerCase().includes(query) ||
        c.role.toLowerCase().includes(query)
      );

      filtered.forEach(c => {
        const status = get3B7Status(c);
        tbody.innerHTML += `
          <tr class="hover:bg-slate-900/50 transition">
            <td class="py-3 px-4 font-bold text-white">${c.name}</td>
            <td class="py-3 px-4 text-slate-300">${c.role} <span class="text-slate-500">at</span> <span class="font-semibold text-slate-200">${c.company}</span></td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-indigo-300 border border-slate-700">
                ${c.stage.replace('_', ' ')}
              </span>
            </td>
            <td class="py-3 px-4 text-slate-400">${c.source}</td>
            <td class="py-3 px-4">
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${status.bg} ${status.color}">
                ${status.label}
              </span>
            </td>
            <td class="py-3 px-4 text-slate-400 font-mono text-[11px]">${c.lastContactDate}</td>
            <td class="py-3 px-4 text-right space-x-2">
              <button onclick="openDetailModal('${c.id}')" class="text-indigo-400 hover:text-indigo-300 font-semibold text-xs">View Drawer</button>
            </td>
          </tr>
        `;
      });
    }

    /* ==========================================================================
       TEMPLATE QUICK-LAUNCHER ENGINE
       ========================================================================== */

    function selectTemplate(key) {
      selectedTemplateKey = key;
      document.querySelectorAll('.tmpl-select-btn').forEach(btn => {
        btn.classList.remove('border-indigo-500/50', 'bg-indigo-500/10');
        btn.classList.add('border-slate-800', 'bg-slate-900/60');
      });

      const activeBtn = document.getElementById(`tmpl-btn-${key}`);
      if (activeBtn) {
        activeBtn.classList.add('border-indigo-500/50', 'bg-indigo-500/10');
        activeBtn.classList.remove('border-slate-800', 'bg-slate-900/60');
      }

      const tmpl = TEMPLATES[key];
      document.getElementById('template-title').innerText = tmpl.title;
      document.getElementById('template-desc').innerText = tmpl.desc;

      updateTemplatePreview();
    }

    function updateTemplatePreview() {
      const name = document.getElementById('tmpl-var-name').value || '[Name]';
      const company = document.getElementById('tmpl-var-company').value || '[Company]';
      const topic = document.getElementById('tmpl-var-topic').value || '[Topic]';

      const tmpl = TEMPLATES[selectedTemplateKey];
      let body = tmpl.body
        .replace(/{NAME}/g, name)
        .replace(/{COMPANY}/g, company)
        .replace(/{TOPIC}/g, topic);

      document.getElementById('template-output').value = body;
    }

    function launchTemplateForContact(contactId, templateKey) {
      const contact = contacts.find(c => c.id === contactId);
      if (!contact) return;

      switchTab('templates');
      selectTemplate(templateKey);

      document.getElementById('tmpl-var-name').value = contact.name;
      document.getElementById('tmpl-var-company').value = contact.company;
      document.getElementById('tmpl-var-topic').value = contact.notes ? contact.notes.substring(0, 30) : 'scaling models';

      updateTemplatePreview();
    }

    function copyGeneratedTemplate() {
      const text = document.getElementById('template-output').value;
      
      // Iframe safe clipboard copy fallback
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Template copied to clipboard!', 'success');
      } catch (err) {
        showToast('Failed to copy', 'error');
      }
      document.body.removeChild(textarea);
    }

    /* ==========================================================================
       CONTACT MODAL & DETAIL DRAWER HANDLERS
       ========================================================================== */

    function openContactModal(contactId = null) {
      const modal = document.getElementById('contact-modal');
      const title = document.getElementById('contact-modal-title');
      const form = document.getElementById('contact-form');
      form.reset();

      if (contactId) {
        const contact = contacts.find(c => c.id === contactId);
        title.innerText = "Edit Contact";
        document.getElementById('form-contact-id').value = contact.id;
        document.getElementById('form-name').value = contact.name;
        document.getElementById('form-company').value = contact.company;
        document.getElementById('form-role').value = contact.role;
        document.getElementById('form-linkedin').value = contact.linkedin;
        document.getElementById('form-stage').value = contact.stage;
        document.getElementById('form-source').value = contact.source;
        document.getElementById('form-notes').value = contact.notes;
      } else {
        title.innerText = "Add Target Contact";
        document.getElementById('form-contact-id').value = '';
      }

      modal.classList.remove('hidden');
    }

    function closeContactModal() {
      document.getElementById('contact-modal').classList.add('hidden');
    }

    function handleSaveContact(e) {
      e.preventDefault();
      const id = document.getElementById('form-contact-id').value;
      const name = document.getElementById('form-name').value;
      const company = document.getElementById('form-company').value;
      const role = document.getElementById('form-role').value;
      const linkedin = document.getElementById('form-linkedin').value;
      const stage = document.getElementById('form-stage').value;
      const source = document.getElementById('form-source').value;
      const notes = document.getElementById('form-notes').value;

      if (id) {
        // Edit existing
        const contact = contacts.find(c => c.id === id);
        if (contact) {
          contact.name = name;
          contact.company = company;
          contact.role = role;
          contact.linkedin = linkedin;
          contact.stage = stage;
          contact.source = source;
          contact.notes = notes;
        }
      } else {
        // Create new
        const newContact = {
          id: 'c_' + Date.now(),
          name,
          company,
          role,
          linkedin,
          stage,
          source,
          lastContactDate: getRelativeDate(0),
          notes,
          logs: [
            { type: 'INITIAL_OUTREACH', date: getRelativeDate(0), summary: 'Added contact to tracking pipeline.' }
          ]
        };
        contacts.unshift(newContact);
      }

      saveContacts();
      closeContactModal();
      showToast('Saved contact successfully!', 'success');
    }

    function openDetailModal(contactId) {
      activeDetailContactId = contactId;
      const contact = contacts.find(c => c.id === contactId);
      if (!contact) return;

      document.getElementById('detail-name').innerText = contact.name;
      document.getElementById('detail-role-company').innerText = `${contact.role} @ ${contact.company}`;
      document.getElementById('detail-linkedin').href = contact.linkedin || '#';
      document.getElementById('detail-source').innerText = contact.source;
      document.getElementById('detail-last-contact').innerText = contact.lastContactDate;
      document.getElementById('detail-notes').innerText = contact.notes || 'No research notes recorded yet.';
      document.getElementById('detail-stage-select').value = contact.stage;

      // Render Stage Badge
      document.getElementById('detail-stage-badge').innerHTML = `
        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-indigo-300 border border-slate-700">
          ${contact.stage.replace('_', ' ')}
        </span>
      `;

      // Render 3B7 Engine status
      const status3b7 = get3B7Status(contact);
      document.getElementById('detail-3b7-status').innerHTML = `
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${status3b7.bg} ${status3b7.color}">
          ${status3b7.label}
        </span>
      `;

      // Render Interaction Timeline Logs
      renderDetailLogs(contact);

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.getElementById('log-form-container').classList.add('hidden');
    }

    function editCurrentContact() {
      if (activeDetailContactId) {
        closeDetailModal();
        openContactModal(activeDetailContactId);
      }
    }

    function updateContactStageFromModal() {
      const newStage = document.getElementById('detail-stage-select').value;
      const contact = contacts.find(c => c.id === activeDetailContactId);
      if (contact) {
        contact.stage = newStage;
        contact.lastContactDate = getRelativeDate(0);
        saveContacts();
        openDetailModal(contact.id);
        showToast(`Stage updated to ${newStage}`, 'info');
      }
    }

    function renderDetailLogs(contact) {
      const logsTimeline = document.getElementById('detail-logs-timeline');
      logsTimeline.innerHTML = '';

      if (!contact.logs || contact.logs.length === 0) {
        logsTimeline.innerHTML = `<p class="text-slate-500 italic text-[11px]">No activity logged yet.</p>`;
        return;
      }

      contact.logs.forEach(log => {
        logsTimeline.innerHTML += `
          <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-[11px] space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-bold text-indigo-300">${log.type.replace('_', ' ')}</span>
              <span class="text-slate-500 font-mono text-[10px]">${log.date}</span>
            </div>
            <p class="text-slate-300">${log.summary}</p>
          </div>
        `;
      });
    }

    function toggleLogForm() {
      const container = document.getElementById('log-form-container');
      container.classList.toggle('hidden');
      document.getElementById('log-date').value = getRelativeDate(0);
    }

    function saveInteractionLog() {
      const contact = contacts.find(c => c.id === activeDetailContactId);
      if (!contact) return;

      const type = document.getElementById('log-type').value;
      const date = document.getElementById('log-date').value || getRelativeDate(0);
      const summary = document.getElementById('log-content').value;

      if (!summary) {
        showToast('Please enter log summary', 'error');
        return;
      }

      if (!contact.logs) contact.logs = [];
      contact.logs.unshift({ type, date, summary });
      contact.lastContactDate = date;

      saveContacts();
      openDetailModal(contact.id);
      toggleLogForm();
      showToast('Activity log recorded', 'success');
    }

    /* ==========================================================================
       VELOCITY CHART VISUALIZER (CHART.JS)
       ========================================================================== */

    function initVelocityChart() {
      const ctx = document.getElementById('velocityChart')?.getContext('2d');
      if (!ctx) return;

      velocityChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Wk 1', 'Wk 2', 'Wk 3', 'Wk 4', 'Current Wk'],
          datasets: [
            {
              label: 'Outreach Sent',
              data: [3, 4, 5, 2, 4],
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.1)',
              borderWidth: 2,
              tension: 0.3,
              fill: true
            },
            {
              label: 'Interviews Booked',
              data: [1, 1, 2, 0, 2],
              borderColor: '#10b981',
              backgroundColor: 'transparent',
              borderWidth: 2,
              borderDash: [4, 4],
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#94a3b8', font: { size: 10 } }
            }
          },
          scales: {
            x: {
              ticks: { color: '#64748b', font: { size: 10 } },
              grid: { color: 'rgba(255, 255, 255, 0.05)' }
            },
            y: {
              ticks: { color: '#64748b', font: { size: 10 } },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              beginAtZero: true
            }
          }
        }
      });
    }

    /* ==========================================================================
       TOAST NOTIFICATION ENGINE
       ========================================================================== */

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const typeStyles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-indigo-600 text-white border-indigo-500'
      };

      toast.className = `px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 ${typeStyles[type] || typeStyles.info}`;
      toast.innerHTML = `
        <i class="fa-solid fa-circle-info"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
