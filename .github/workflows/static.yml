<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach CRM & Velocity Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js for Campaign Velocity Visualizer -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f6ff',
              100: '#e0edff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            ai: {
              accent: '#6366f1',
              glow: '#818cf8',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for sleek UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .kanban-col {
      min-height: calc(100vh - 220px);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-200 bg-slate-950">

  <!-- Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-brand-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid font-bold text-white text-lg fa-bolt-lightning"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
            AI Outreach CRM
            <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">v1.0 Pro</span>
          </h1>
          <p class="text-xs text-slate-400">Informational Interview & Campaign Velocity Hub</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-white bg-indigo-600 transition">
          <i class="fa-solid fa-gauge-high mr-1.5"></i> Dashboard & Action Hub
        </button>
        <button onclick="switchTab('pipeline')" id="nav-pipeline" class="nav-btn px-4 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-kanban mr-1.5"></i> Pipeline Kanban
        </button>
        <button onclick="switchTab('contacts')" id="nav-contacts" class="nav-btn px-4 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-address-book mr-1.5"></i> Contacts Directory
        </button>
        <button onclick="switchTab('templates')" id="nav-templates" class="nav-btn px-4 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-file-lines mr-1.5"></i> Message Templates
        </button>
        <button onclick="switchTab('tiara')" id="nav-tiara" class="nav-btn px-4 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-compass mr-1.5"></i> TIARA Framework
        </button>
      </nav>

      <!-- Quick Action Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="openContactModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-md shadow-indigo-600/20 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-user-plus text-sm"></i>
          <span>Add Contact</span>
        </button>
        <button onclick="resetMockData()" title="Reset to Sample Data" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-2 rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Main Scrollable App Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- ==================== TAB 1: DASHBOARD & ACTION HUB ==================== -->
    <section id="tab-dashboard" class="tab-content space-y-6">

      <!-- Top Section: Weekly Pace Gauges -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        
        <!-- KPI Card 1: New Outreach Sent -->
        <div class="glass-card rounded-2xl p-5 border border-slate-800 relative overflow-hidden">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Weekly Goal 1</span>
              <h3 class="text-lg font-bold text-white mt-0.5">New Outreach Sent</h3>
            </div>
            <span class="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
              <i class="fa-solid fa-paper-plane text-lg"></i>
            </span>
          </div>
          <div class="mt-4 flex items-baseline space-x-2">
            <span id="kpi-outreach-val" class="text-3xl font-extrabold text-white">4</span>
            <span class="text-sm font-semibold text-slate-400">/ 5 target</span>
            <span id="kpi-outreach-status" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-medium">
              On Pace
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-slate-800 rounded-full h-2.5 mt-3 overflow-hidden">
            <div id="kpi-outreach-bar" class="bg-gradient-to-r from-indigo-500 to-blue-400 h-2.5 rounded-full" style="width: 80%"></div>
          </div>
          <p class="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
            <span>Target: 3 - 5 new messages / wk</span>
            <span id="kpi-outreach-pct" class="font-semibold text-slate-300">80%</span>
          </p>
        </div>

        <!-- KPI Card 2: Interviews Scheduled -->
        <div class="glass-card rounded-2xl p-5 border border-slate-800 relative overflow-hidden">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Weekly Goal 2</span>
              <h3 class="text-lg font-bold text-white mt-0.5">Interviews Scheduled</h3>
            </div>
            <span class="p-2 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20">
              <i class="fa-solid fa-calendar-check text-lg"></i>
            </span>
          </div>
          <div class="mt-4 flex items-baseline space-x-2">
            <span id="kpi-interviews-val" class="text-3xl font-extrabold text-white">2</span>
            <span class="text-sm font-semibold text-slate-400">/ 3 target</span>
            <span id="kpi-interviews-status" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-medium">
              Needs 1 More
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-slate-800 rounded-full h-2.5 mt-3 overflow-hidden">
            <div id="kpi-interviews-bar" class="bg-gradient-to-r from-amber-500 to-yellow-400 h-2.5 rounded-full" style="width: 66%"></div>
          </div>
          <p class="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
            <span>Target: 1 - 3 scheduled / wk</span>
            <span id="kpi-interviews-pct" class="font-semibold text-slate-300">66%</span>
          </p>
        </div>

        <!-- KPI Card 3: Post-Interview Follow-up Rate -->
        <div class="glass-card rounded-2xl p-5 border border-slate-800 relative overflow-hidden">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Weekly Goal 3</span>
              <h3 class="text-lg font-bold text-white mt-0.5">Follow-up Completion</h3>
            </div>
            <span class="p-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <i class="fa-solid fa-circle-check text-lg"></i>
            </span>
          </div>
          <div class="mt-4 flex items-baseline space-x-2">
            <span id="kpi-followup-val" class="text-3xl font-extrabold text-white">100%</span>
            <span class="text-sm font-semibold text-slate-400">scheduled</span>
            <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-medium">
              100% Standard
            </span>
          </div>
          <!-- Progress Bar -->
          <div class="w-full bg-slate-800 rounded-full h-2.5 mt-3 overflow-hidden">
            <div id="kpi-followup-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2.5 rounded-full" style="width: 100%"></div>
          </div>
          <p class="text-[11px] text-slate-400 mt-2 flex items-center justify-between">
            <span>Target: 100% completed &lt; 24h</span>
            <span class="font-semibold text-emerald-400">Optimal</span>
          </p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left 2 Columns: "Actions Required Today" Queue -->
        <div class="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-800 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
              <div class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
              <h2 class="text-base font-bold text-white flex items-center gap-2">
                Actions Required Today
                <span id="action-queue-count" class="text-xs px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 font-semibold border border-rose-500/30">3 pending</span>
              </h2>
            </div>
            <span class="text-xs text-slate-400 font-mono">3B7 Follow-up Engine Active</span>
          </div>

          <!-- Action Items Dynamic Container -->
          <div id="action-queue-list" class="space-y-3">
            <!-- Dynamic elements populated by JS renderDashboard() -->
          </div>
        </div>

        <!-- Right Column: Campaign Velocity Visualizer Chart -->
        <div class="glass-card rounded-2xl p-6 border border-slate-800 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-base font-bold text-white">Campaign Velocity</h2>
              <span class="text-xs text-slate-400">Past 5 Weeks</span>
            </div>
            <p class="text-xs text-slate-400 mb-4">Outreach vs. Interviews Scheduled trend line.</p>
            <div class="h-48 relative">
              <canvas id="velocityChart"></canvas>
            </div>
          </div>

          <!-- Conversion Funnel Summary -->
          <div class="mt-4 pt-4 border-t border-slate-800 grid grid-cols-3 text-center gap-2">
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-800/80">
              <span class="text-[10px] uppercase text-slate-400 block font-semibold">Total Sent</span>
              <span id="funnel-sent" class="text-sm font-bold text-white">18</span>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-800/80">
              <span class="text-[10px] uppercase text-slate-400 block font-semibold">Replies</span>
              <span id="funnel-replies" class="text-sm font-bold text-indigo-400">8 (44%)</span>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-800/80">
              <span class="text-[10px] uppercase text-slate-400 block font-semibold">Booked</span>
              <span id="funnel-booked" class="text-sm font-bold text-emerald-400">5 (28%)</span>
            </div>
          </div>
        </div>

      </div>

    </section>

    <!-- ==================== TAB 2: PIPELINE KANBAN BOARD ==================== -->
    <section id="tab-pipeline" class="tab-content hidden space-y-4">
      
      <!-- Pipeline Header & Search Filter Bar -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
        <div>
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            Outreach Pipeline
            <span class="text-xs font-normal text-slate-400">(Drag or click arrows to shift contacts)</span>
          </h2>
          <p class="text-xs text-slate-400">Monitors stage progression and applies automatic 3B7 business day rule logic.</p>
        </div>

        <div class="flex items-center space-x-3 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
            <input type="text" id="pipeline-search" oninput="renderPipeline()" placeholder="Search name, company, role..." class="w-full bg-slate-950 text-xs text-white pl-8 pr-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500">
          </div>
          <select id="pipeline-source-filter" onchange="renderPipeline()" class="bg-slate-950 text-xs text-slate-300 py-2 px-3 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500">
            <option value="ALL">All Sources</option>
            <option value="AI Innovators List">AI Innovators List</option>
            <option value="Conference / Event">Conference / Event</option>
            <option value="LinkedIn Cold">LinkedIn Cold</option>
            <option value="Mutual Connection">Mutual Connection</option>
          </select>
        </div>
      </div>

      <!-- Kanban Columns Container -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 overflow-x-auto pb-4">
        
        <!-- Column 1: Identified -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-slate-400"></span> 1. Identified
            </span>
            <span id="count-stage-IDENTIFIED" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-IDENTIFIED" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'IDENTIFIED')"></div>
        </div>

        <!-- Column 2: Messaged -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-blue-400 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-400"></span> 2. Messaged
            </span>
            <span id="count-stage-MESSAGED" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-MESSAGED" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'MESSAGED')"></div>
        </div>

        <!-- Column 3: Awaiting Reply -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span> 3. Awaiting Reply
            </span>
            <span id="count-stage-AWAITING_REPLY" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-AWAITING_REPLY" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'AWAITING_REPLY')"></div>
        </div>

        <!-- Column 4: Interview Scheduled -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-indigo-400"></span> 4. Scheduled
            </span>
            <span id="count-stage-INTERVIEW_SCHEDULED" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-INTERVIEW_SCHEDULED" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'INTERVIEW_SCHEDULED')"></div>
        </div>

        <!-- Column 5: Follow-up Pending -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-rose-400 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-rose-400"></span> 5. Follow-up
            </span>
            <span id="count-stage-FOLLOWUP_PENDING" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-FOLLOWUP_PENDING" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'FOLLOWUP_PENDING')"></div>
        </div>

        <!-- Column 6: Advocate / Nurture -->
        <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3 flex flex-col kanban-col min-w-[210px]">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wide flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span> 6. Advocate
            </span>
            <span id="count-stage-ADVOCATE" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </div>
          <div id="col-ADVOCATE" class="flex-1 space-y-2.5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'ADVOCATE')"></div>
        </div>

      </div>
    </section>

    <!-- ==================== TAB 3: CONTACTS DIRECTORY ==================== -->
    <section id="tab-contacts" class="tab-content hidden space-y-4">
      
      <div class="glass-card rounded-2xl p-6 border border-slate-800">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
          <div>
            <h2 class="text-lg font-bold text-white">Contacts Directory</h2>
            <p class="text-xs text-slate-400">Comprehensive view of all identified target industry experts.</p>
          </div>
          <div class="flex items-center space-x-3 w-full sm:w-auto">
            <input type="text" id="directory-search" oninput="renderDirectory()" placeholder="Filter contacts..." class="bg-slate-950 text-xs text-white px-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500 w-full sm:w-64">
            <button onclick="openContactModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 shrink-0">
              <i class="fa-solid fa-plus"></i> New Contact
            </button>
          </div>
        </div>

        <!-- Directory Table -->
        <div class="overflow-x-auto mt-4">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800">
                <th class="py-3 px-4">Contact</th>
                <th class="py-3 px-4">Company & Role</th>
                <th class="py-3 px-4">Current Stage</th>
                <th class="py-3 px-4">Source</th>
                <th class="py-3 px-4">3B7 Follow-up Status</th>
                <th class="py-3 px-4">Last Active</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="directory-tbody" class="divide-y divide-slate-800/60 text-xs">
              <!-- Dynamically rendered rows -->
            </tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- ==================== TAB 4: MESSAGE TEMPLATES ==================== -->
    <section id="tab-templates" class="tab-content hidden space-y-6">
      
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Sidebar: Template Selection -->
        <div class="glass-card rounded-2xl p-5 border border-slate-800 space-y-3">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-2">Select Outreach Template</h3>
          
          <div class="space-y-2">
            <button onclick="selectTemplate('initial')" id="tmpl-btn-initial" class="tmpl-select-btn w-full text-left p-3 rounded-xl border border-indigo-500/50 bg-indigo-500/10 text-white font-medium text-xs flex items-center justify-between">
              <div>
                <p class="font-bold text-indigo-300">Initial Outreach</p>
                <p class="text-[11px] text-slate-400">Warm/Cold value-add request</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>

            <button onclick="selectTemplate('nudge')" id="tmpl-btn-nudge" class="tmpl-select-btn w-full text-left p-3 rounded-xl border border-slate-800 bg-slate-900/60 text-slate-300 font-medium text-xs flex items-center justify-between hover:border-slate-700">
              <div>
                <p class="font-bold text-amber-300">3B7 Nudge (Day +3)</p>
                <p class="text-[11px] text-slate-400">Low-friction short reminder</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>

            <button onclick="selectTemplate('pivot')" id="tmpl-btn-pivot" class="tmpl-select-btn w-full text-left p-3 rounded-xl border border-slate-800 bg-slate-900/60 text-slate-300 font-medium text-xs flex items-center justify-between hover:border-slate-700">
              <div>
