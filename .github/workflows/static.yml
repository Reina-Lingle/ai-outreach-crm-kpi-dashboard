      },
      thankyou: {
        title: "Post-Interview Thank You (< 24 Hours)",
        desc: "Essential follow-up reinforcing a key takeaway and providing value.",
        body: `Hi {NAME},

Thank you so much for taking the time to speak with me today! Your insights on {TOPIC} at {COMPANY} were tremendously helpful.

