[Your Name]`
      },
      pivot: {
        title: "3B7 Pivot / Graceful Closure (Day +7)",
        desc: "Sent after 7 business days to offer a resource and gracefully close the loop.",
        body: `Hi {NAME},

I know you’re likely in the thick of major milestones at {COMPANY}. I’ll close the loop on this for now so I don’t clutter your inbox.

